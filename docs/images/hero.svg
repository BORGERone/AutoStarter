    <path d="M868 375v-12M862 369h12" stroke="#8FF0CB" stroke-width="2" stroke-linecap="round"/>
    <text x="886" y="379" fill="#A7F0D3" font-size="12" font-weight="600">Добавить</text>
    <circle cx="1163" cy="375" r="15" fill="#152029" stroke="#31444F"/>
