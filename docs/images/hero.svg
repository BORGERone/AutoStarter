<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">AutoStarter — ваши программы, ваш порядок запуска</title>
  <desc id="desc">Тёмная обложка с мятными акцентами. От часов расходятся линии к символам приложений. Менеджер запуска программ для Windows на Tauri и Rust.</desc>
