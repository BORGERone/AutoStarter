      <text x="260" y="418" fill="#C3D2DD" letter-spacing=".4">10 языков интерфейса</text>

      <rect x="434" y="396" width="150" height="34" rx="10" fill="#122029" stroke="#2A3E4A"/>
      <circle cx="454" cy="413" r="3.5" fill="#80E8BF"/>
      <text x="468" y="418" fill="#C3D2DD" letter-spacing=".4">Локальные данные</text>
    </g>

    <text x="64" y="472" fill="#5E7382" font-size="11" letter-spacing="2.4">AUTOSTART MANAGER · ОТКРЫТЫЙ ИСХОДНЫЙ КОД</text>
  </g>

  <g>
    <ellipse cx="1020" cy="262" rx="210" ry="180" fill="#5FE3B4" fill-opacity=".10" filter="url(#soft)"/>
    <g stroke="#80E8BF" fill="none">
