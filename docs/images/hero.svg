<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">AutoStarter — ваши программы, ваш порядок запуска</title>
  <desc id="desc">Тёмная обложка с мятными акцентами. Слева название и описание, справа окно менеджера со списком программ. Менеджер запуска программ для Windows на Tauri и Rust.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081018"/>
      <stop offset=".55" stop-color="#0A1420"/>
      <stop offset="1" stop-color="#0B0D17"/>
    </linearGradient>
    <radialGradient id="glowMint" cx="0" cy="0" r="1" gradientTransform="translate(950 200) scale(520 420)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5FE3B4" stop-opacity=".20"/>
      <stop offset="1" stop-color="#5FE3B4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientTransform="translate(180 480) scale(520 380)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4E8BFF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#4E8BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#C6FFE8"/>
      <stop offset=".5" stop-color="#7BF0C4"/>
      <stop offset="1" stop-color="#3FB49E"/>
    </linearGradient>
    <linearGradient id="win" x1="820" y1="110" x2="1230" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16232E"/>
      <stop offset="1" stop-color="#0E161F"/>
    </linearGradient>
    <linearGradient id="rowA" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#1B2E31"/>
      <stop offset="1" stop-color="#16222C" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3C5A56"/>
      <stop offset=".5" stop-color="#1D2933"/>
      <stop offset="1" stop-color="#32465A"/>
    </linearGradient>
    <linearGradient id="rule" x1="64" y1="0" x2="660" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#80E8BF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#80E8BF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topline" x1="64" y1="0" x2="420" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#80E8BF"/>
      <stop offset="1" stop-color="#80E8BF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#9DB6C8" stroke-opacity=".05"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="520" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="520" rx="26" fill="url(#grid)"/>
  <rect width="1280" height="520" rx="26" fill="url(#glowMint)"/>
  <rect width="1280" height="520" rx="26" fill="url(#glowBlue)"/>
  <rect x=".75" y=".75" width="1278.5" height="518.5" rx="25.25" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M64 1H420" stroke="url(#topline)" stroke-width="2.5"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="64" y="64" width="208" height="34" rx="17" fill="#102B23" stroke="#2F5E4E"/>
    <circle cx="84" cy="81" r="4.5" fill="#80E8BF"/>
    <circle cx="84" cy="81" r="9" fill="#80E8BF" fill-opacity=".18"/>
    <text x="100" y="86" fill="#A9F2D3" font-size="12" font-weight="700" letter-spacing="1.6">WINDOWS UTILITY</text>

    <text x="60" y="196" fill="#F4F9FC" font-size="82" font-weight="700" letter-spacing="-3.5">Auto<tspan fill="url(#mint)">Starter</tspan></text>

    <text x="64" y="250" fill="#E6EFF4" font-size="27" font-weight="500">Ваши программы.</text>
    <text x="64" y="288" fill="#E6EFF4" font-size="27" font-weight="500">Ваш порядок запуска.</text>
    <text x="64" y="332" fill="#95A9B8" font-size="17">Автозапуск Windows · Режимы окон · Системный трей</text>

    <path d="M64 372H660" stroke="url(#rule)"/>

    <g font-size="13">
      <rect x="64" y="396" width="150" height="34" rx="10" fill="#122029" stroke="#2A3E4A"/>
      <circle cx="84" cy="413" r="3.5" fill="#FF8C5A"/>
