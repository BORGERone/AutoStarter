    <g>
      <rect x="850" y="234" width="328" height="52" rx="13" fill="url(#rowA)" stroke="#2F4A4A"/>
      <rect x="864" y="248" width="24" height="24" rx="7" fill="#1E4438" stroke="#3E7A63"/>
      <path d="M870 260h12" stroke="#80E8BF" stroke-width="2" stroke-linecap="round"/>
      <text x="902" y="257" fill="#EAF3F7" font-size="14" font-weight="600">Мессенджер</text>
      <text x="902" y="275" fill="#7D93A2" font-size="11">Свёрнуто в трей</text>
      <rect x="1120" y="249" width="42" height="22" rx="11" fill="#1E5A46" stroke="#3E8E70"/>
      <circle cx="1151" cy="260" r="8" fill="#B6FFE1"/>
    </g>

    <g>
      <rect x="850" y="296" width="328" height="52" rx="13" fill="#131C24" stroke="#26333D"/>
      <rect x="864" y="310" width="24" height="24" rx="7" fill="#1B242C" stroke="#33434E"/>
      <path d="M870 322h12" stroke="#5E7482" stroke-width="2" stroke-linecap="round"/>
      <text x="902" y="319" fill="#94A6B3" font-size="14" font-weight="600">Служебный скрипт</text>
      <text x="902" y="337" fill="#66798A" font-size="11">Скрыто · выключено</text>
      <rect x="1120" y="311" width="42" height="22" rx="11" fill="#1D2831" stroke="#33434E"/>
