      <stop offset="1" stop-color="#0B0D17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1000 232) rotate(90) scale(255 320)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#80E8BF" stop-opacity=".14"/>
      <stop offset="1" stop-color="#80E8BF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mint" x1="909" y1="148" x2="1069" y2="308" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ADFFDD"/>
      <stop offset="1" stop-color="#53BFB2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#94A3B8" stroke-opacity=".045"/>
    </pattern>
  </defs>
