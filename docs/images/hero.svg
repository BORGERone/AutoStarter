      <text x="902" y="213" fill="#7D93A2" font-size="11">Обычный запуск</text>
      <rect x="1120" y="187" width="42" height="22" rx="11" fill="#1E5A46" stroke="#3E8E70"/>
      <circle cx="1151" cy="198" r="8" fill="#B6FFE1"/>
